
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>關於我們｜AURELIA VOYAGE</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      background: #fffaf4;
      color: #344b5e;
      font-family: "Noto Sans TC", "PingFang TC",
        "Microsoft JhengHei", sans-serif;
      line-height: 2;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 55px 48px 75px;
    }

    .brand {
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #b28b60;
      margin-bottom: 15px;
    }

    h1 {
      color: #193b62;
      font-size: clamp(27px, 4vw, 38px);
      font-weight: 800;
      text-align: center;
      line-height: 1.5;
      margin: 0 0 22px;
    }

    .line {
      width: 75px;
      height: 4px;
      background: #dfb276;
      border-radius: 10px;
      margin: 0 auto 45px;
    }

    .content {
      max-width: 830px;
      margin: 0 auto;
      font-size: 18px;
      letter-spacing: 0.4px;
      text-align: left;
    }

    .content p {
      margin: 0 0 30px;
    }

    .content p:last-child {
      margin-bottom: 0;
    }

    @media (max-width: 600px) {
      main {
        padding: 35px 22px 50px;
      }

      .content {
        font-size: 16px;
        line-height: 1.95;
      }

      .line {
        margin-bottom: 32px;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="brand">AURELIA VOYAGE</div>

    <h1>關西只是起點，世界在前方</h1>

    <div class="line"></div>

    <section class="content">
      <p>
        我們是一家以旅人需求為核心的旅遊顧問公司，
        相信美好的旅行，始於用心的規劃。
      </p>

      <p>
        「關西旅誌」是我們的第一步。我們整合景點、
        交通、季節特色與行程建議，將繁雜資訊整理成
        清楚實用的指南，協助每位旅人找到適合自己的
        旅行方式。
      </p>

      <p>
        未來，我們將逐步拓展更多地區，持續以專業與
        熱情，陪伴旅人探索世界，讓每一次出發都更有方向。
      </p>
    </section>
  </main>
</body>
</html>
