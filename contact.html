
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聯絡我們｜AURELIA VOYAGE</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "PingFang TC", sans-serif;
      background: #faf9f6;
      color: #334155;
      line-height: 1.8;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 55px 24px 75px;
    }

    .heading {
      text-align: center;
      margin-bottom: 35px;
    }

    .brand {
      color: #ad9266;
      font-size: 13px;
      letter-spacing: 4px;
    }

    h1 {
      font-size: 32px;
      margin: 12px 0;
      color: #26384b;
    }

    .line {
      width: 60px;
      height: 3px;
      background: #cbb48a;
      margin: 18px auto;
    }

    .intro {
      color: #64748b;
      font-size: 15px;
    }

    .form-card {
      background: #fff;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.06);
    }

    .field { margin-bottom: 23px; }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    .required { color: #b45353; }

    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d6dce3;
      border-radius: 9px;
      font: inherit;
      font-size: 15px;
      background: white;
      color: #334155;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #b99b6b;
      box-shadow: 0 0 0 3px rgba(185,155,107,.12);
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    .privacy {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 22px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #30465d;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: #24374c; }
    button:disabled { opacity: .6; cursor: wait; }

    #status {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
    }

    .footer {
      margin-top: 35px;
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
    }

    .hidden {
      position: absolute;
      left: -9999px;
    }

    @media (max-width: 600px) {
      .container { padding: 30px 15px 45px; }
      .form-card { padding: 24px 18px; }
      h1 { font-size: 27px; }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="heading">
      <div class="brand">AURELIA VOYAGE</div>
      <h1>聯絡我們</h1>
      <div class="line"></div>
      <p class="intro">
        關於旅遊規劃、網站內容或合作建議，
        歡迎留下訊息，我們期待與您交流。
      </p>
    </header>

    <section class="form-card">
      <form id="contactForm"
            action="https://script.google.com/macros/s/AKfycbx4fpNl3bKpx1umyqMTmvbYclZM2oJja157xGNopubPEl970Y89Y5-cGraoMcP-M9s3/exec"
            method="post" target="_blank" rel="noopener">

        <div class="field">
          <label for="name">
            姓名 <span class="required">*</span>
          </label>
          <input id="name" name="name"
                 type="text" maxlength="80" required>
        </div>

        <div class="field">
          <label for="email">
            電子郵件 <span class="required">*</span>
          </label>
          <input id="email" name="email"
                 type="email" maxlength="150" required>
        </div>

        <div class="field">
          <label for="phone">聯絡電話（選填）</label>
          <input id="phone" name="phone"
                 type="tel" maxlength="30">
        </div>

        <div class="field">
          <label for="subject">
            聯絡主題 <span class="required">*</span>
          </label>
          <select id="subject" name="subject" required>
            <option value="">請選擇聯絡主題</option>
            <option value="旅遊規劃諮詢">旅遊規劃諮詢</option>
            <option value="關西旅誌相關">關西旅誌相關</option>
            <option value="網站資訊建議">網站資訊建議</option>
            <option value="合作洽詢">合作洽詢</option>
            <option value="其他問題">其他問題</option>
          </select>
        </div>

        <div class="field">
          <label for="message">
            訊息內容 <span class="required">*</span>
          </label>
          <textarea id="message" name="message"
                    maxlength="3000" required
                    placeholder="請輸入您想告訴我們的內容……"></textarea>
        </div>

        <div class="hidden" aria-hidden="true">
          <label for="website">網站</label>
          <input id="website" name="website"
                 type="text" tabindex="-1"
                 autocomplete="off">
        </div>

        <p class="privacy">
          您提供的聯絡資料僅用於處理本次詢問及回覆，
          請勿填寫密碼、信用卡等敏感資訊。
        </p>

        <button id="submitButton" type="submit">
          ✉ 送出諮詢訊息
        </button>

        <div id="status" role="status" aria-live="polite"></div>
      </form>
    </section>

    <div class="footer">
      © AURELIA VOYAGE｜關西只是起點，世界在前方
    </div>

  </main>

  <script>
    const form = document.getElementById("contactForm");
    const button = document.getElementById("submitButton");
    const statusBox = document.getElementById("status");
    let submitting = false;

    form.addEventListener("submit", function(event) {
      if (submitting) {
        event.preventDefault();
        return;
      }

      for (const field of form.querySelectorAll("input, textarea")) {
        field.value = field.value.trim();
      }

      if (form.elements.website.value || !form.reportValidity()) {
        event.preventDefault();
        return;
      }

      // 保留既有 category 相容欄位；其餘欄位由瀏覽器原生編碼。
      let category = form.querySelector('input[name="category"]');
      if (!category) {
        category = document.createElement("input");
        category.type = "hidden";
        category.name = "category";
        form.appendChild(category);
      }
      category.value = form.elements.subject.value;

      // 原生 POST 會使用後端可接收的 application/x-www-form-urlencoded。
      // 在新分頁呈現後端實際結果，不以 opaque fetch 回應宣告成功。
      submitting = true;
      button.disabled = true;
      button.textContent = "已提交，請查看結果分頁";
      statusBox.style.color = "#64748b";
      statusBox.textContent =
        "請查看新開啟分頁的處理結果；此處尚未確認寄信成功。請勿重複送出。若結果分頁未開啟，請先確認瀏覽器是否封鎖新分頁。";
    });
  </script>
</body>
</html>
