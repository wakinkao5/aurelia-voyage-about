
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聯絡我們｜AURELIA VOYAGE</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "PingFang TC", sans-serif;
      background: #faf9f6;
      color: #334155;
      line-height: 1.8;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 55px 24px 75px;
    }

    .heading {
      text-align: center;
      margin-bottom: 35px;
    }

    .brand {
      color: #ad9266;
      font-size: 13px;
      letter-spacing: 4px;
    }

    h1 {
      font-size: 32px;
      margin: 12px 0;
      color: #26384b;
    }

    .line {
      width: 60px;
      height: 3px;
      background: #cbb48a;
      margin: 18px auto;
    }

    .intro {
      color: #64748b;
      font-size: 15px;
    }

    .form-card {
      background: #fff;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.06);
    }

    .field { margin-bottom: 23px; }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    .required { color: #b45353; }

    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d6dce3;
      border-radius: 9px;
      font: inherit;
      font-size: 15px;
      background: white;
      color: #334155;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #b99b6b;
      box-shadow: 0 0 0 3px rgba(185,155,107,.12);
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    .privacy {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 22px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #30465d;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: #24374c; }
    button:disabled { opacity: .6; cursor: wait; }

    #status {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
    }

    .footer {
      margin-top: 35px;
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
    }

    .hidden {
      position: absolute;
      left: -9999px;
    }

    @media (max-width: 600px) {
      .container { padding: 30px 15px 45px; }
      .form-card { padding: 24px 18px; }
      h1 { font-size: 27px; }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="heading">
      <div class="brand">AURELIA VOYAGE</div>
      <h1>聯絡我們</h1>
      <div class="line"></div>
      <p class="intro">
        關於旅遊規劃、網站內容或合作建議，
        歡迎留下訊息，我們期待與您交流。
      </p>
    </header>

    <section class="form-card">
      <form id="contactForm">

        <div class="field">
          <label for="name">
            姓名 <span class="required">*</span>
          </label>
          <input id="name" name="name"
                 type="text" maxlength="80" required>
        </div>

        <div class="field">
          <label for="email">
            電子郵件 <span class="required">*</span>
          </label>
          <input id="email" name="email"
                 type="email" maxlength="150" required>
        </div>

        <div class="field">
          <label for="phone">聯絡電話（選填）</label>
          <input id="phone" name="phone"
                 type="tel" maxlength="30">
        </div>

        <div class="field">
          <label for="subject">
            聯絡主題 <span class="required">*</span>
          </label>
          <select id="subject" name="subject" required>
            <option value="">請選擇聯絡主題</option>
            <option value="旅遊規劃諮詢">旅遊規劃諮詢</option>
            <option value="關西旅誌相關">關西旅誌相關</option>
            <option value="網站資訊建議">網站資訊建議</option>
            <option value="合作洽詢">合作洽詢</option>
            <option value="其他問題">其他問題</option>
          </select>
        </div>

        <div class="field">
          <label for="message">
            訊息內容 <span class="required">*</span>
          </label>
          <textarea id="message" name="message"
                    maxlength="3000" required
                    placeholder="請輸入您想告訴我們的內容……"></textarea>
        </div>

        <div class="hidden" aria-hidden="true">
          <label for="website">網站</label>
          <input id="website" name="website"
                 type="text" tabindex="-1"
                 autocomplete="off">
        </div>

        <p class="privacy">
          您提供的聯絡資料僅用於處理本次詢問及回覆，
          請勿填寫密碼、信用卡等敏感資訊。
        </p>

        <button id="submitButton" type="submit">
          ✉ 送出諮詢訊息
        </button>

        <div id="status" role="status" aria-live="polite"></div>
      </form>
    </section>

    <div class="footer">
      © AURELIA VOYAGE｜關西只是起點，世界在前方
    </div>

  </main>

  <script>
    // 新版 Google Apps Script 正式部署網址
    const ENDPOINT =
      "https://script.google.com/macros/s/AKfycbx4fpNl3bKpx1umyqMTmvbYclZM2oJja157xGNopubPEl970Y89Y5-cGraoMcP-M9s3/exec";

    const form = document.getElementById("contactForm");
    const button = document.getElementById("submitButton");
    const statusBox = document.getElementById("status");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (!form.reportValidity()) return;

      const data = {
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        subject: document.getElementById("subject").value,
        category: document.getElementById("subject").value,
        message: document.getElementById("message").value.trim(),
        website: document.getElementById("website").value
      };

      if (data.website) return;

      if (!data.name || !data.email ||
          !data.subject || !data.message) {
        statusBox.style.color = "#b43c3c";
        statusBox.textContent = "請完整填寫必填欄位。";
        return;
      }

      button.disabled = true;
      button.textContent = "傳送中……";
      statusBox.textContent = "";

      try {
        // Google Apps Script 跨網域接收
        // no-cors 無法讀取伺服器的處理結果
        await fetch(ENDPOINT, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(data)
        });

        statusBox.style.color = "#28764b";
        statusBox.textContent =
          "表單已送出，系統正在處理。請勿重複提交；若未獲回覆，請稍後再次聯絡。";

        // 先保留表單內容，方便寄送異常時重新提交
      } catch (error) {
        console.error("表單傳送錯誤：", error);

        statusBox.style.color = "#b43c3c";
        statusBox.textContent =
          "傳送時發生連線問題，請稍後再試。";
      } finally {
        button.disabled = false;
        button.textContent = "✉ 送出諮詢訊息";
      }
    });
  </script>
</body>
</html>
